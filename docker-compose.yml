services:
  redis:
    image: redis:7
    ports:
    - "6379:6379"
    command:
      - redis-server
      - --requirepass
      - CHANGEME
      - --maxmemory
      - 100mb
      - --maxmemory-policy
      - allkeys-lru
      - --save # no RDB file for cache, since it is volatile
      - ""
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 5s
      retries: 5
  db:
    image: postgres:17
    restart: always
    shm_size: 128mb
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: url_shortener
    volumes:
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 10s
      timeout: 5s
      retries: 5
